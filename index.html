<style>
:root{
  --bg:#0f1115; --surface:#181b22; --surface2:#222632; --text:#eef0f3; --muted:#9aa3ae;
  --prep:#f2b84b; --hold:#4cc38a; --accent:#7aa2ff; --danger:#e5675f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;}
body{padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);overscroll-behavior:none}
.screen{display:none;min-height:100%;flex-direction:column;max-width:520px;margin:0 auto}
.screen.on{display:flex}
h1{font-size:28px;margin:22px 0 4px;letter-spacing:-.3px}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--surface);border-radius:16px;padding:16px;margin:12px 0}
.seg{display:flex;gap:8px}
.seg button{flex:1}
button{font:inherit;color:var(--text);background:var(--surface2);border:0;border-radius:14px;
  padding:14px 12px;min-height:52px;cursor:pointer}
button.sel{outline:2px solid var(--accent);background:#263049}
button.primary{background:var(--accent);color:#0b0f1a;font-weight:600;font-size:19px}
button.ok{background:var(--hold);color:#06150d;font-weight:600;font-size:19px}
button.ghost{background:transparent;color:var(--muted)}
button:disabled{opacity:.4}
select,input{font:inherit;color:var(--text);background:var(--surface2);border:0;border-radius:12px;
  padding:12px;width:100%}
label.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0}
label.row input[type=checkbox]{width:24px;height:24px}
.grow{flex:1}
.bottom{padding:12px 0 16px;display:grid;gap:10px}
/* Lauf */
.top{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin:10px 0 0}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.phase{display:inline-block;font-size:14px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;margin-top:18px}
.phase.prep{background:#3b2f14;color:var(--prep)}
.phase.hold{background:#123323;color:var(--hold)}
.phase.check{background:#1c2540;color:var(--accent)}
.phase.pause{background:#3a1d1b;color:var(--danger)}
.name{font-size:30px;font-weight:700;margin:10px 0 2px;letter-spacing:-.3px}
.side{font-size:20px;color:var(--prep);font-weight:600;min-height:28px}
.exrow{display:flex;gap:12px;align-items:center;margin:12px 0 4px}
.fig{flex:1.25;background:var(--surface);border-radius:16px;padding:6px;min-width:0}
.fig svg{width:100%;height:auto;display:block}
.fig polyline,.fig line,.fig path.ln{fill:none;stroke:#eef0f3;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.fig .hd{fill:#eef0f3}
.fig path.ar{fill:none;stroke:#7aa2ff;stroke-width:2.5;stroke-linecap:round}
.fig line.fl{stroke:#3a4150;stroke-width:2}
.fig line.bd{stroke:#e5675f;stroke-width:3}
.fig line.st{stroke:#9aa3ae;stroke-width:5}
.fig text{fill:#7aa2ff;font-size:12px;font-weight:700}
.emoji{font-size:84px;text-align:center;margin:14px 0 4px}
.liste{list-style:none;padding:0;margin:8px 0 0;background:var(--surface);border-radius:16px}
.liste li{padding:12px 14px;border-bottom:1px solid #262a35;font-size:17px;display:flex;gap:10px;align-items:baseline}
.liste li:last-child{border:0}
.liste li .n{color:var(--accent);font-weight:700;min-width:18px}
.liste li small{display:block;color:var(--muted);font-size:13px}
.liste li.kauf{color:var(--muted)}
.liste li.kopf{font-size:13px;color:var(--muted);padding:10px 14px 6px}
body.nacht{background:#000!important}
body.nacht #s-run{opacity:.45}
.reps{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:6px}
.reps button{width:64px;font-size:28px}
.reps b{font-size:56px;min-width:80px;text-align:center;font-variant-numeric:tabular-nums}
.exrow .ringwrap{flex:1;width:auto;margin:0}
.exrow .ringwrap .num{font-size:52px}
.ringwrap{position:relative;width:min(70vw,260px);aspect-ratio:1;margin:14px auto 6px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:84px;font-weight:700;font-variant-numeric:tabular-nums}
.cue{font-size:18px;color:#cfd5dc;margin:4px 0 0}
.next{font-size:15px;color:var(--muted);margin-top:12px}
.ctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.ctrl button{white-space:nowrap;padding:14px 6px}
.kg{font-size:34px;text-align:center;font-weight:700;margin-top:12px}
.sum div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #262a35}
.sum div:last-child{border:0}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:var(--muted);background:var(--surface);
  padding:10px;border-radius:12px}
.hidden{display:none!important}
/* ===== Design ===== */
:root{--sun1:#ff9a5a;--sun2:#e8577e;--sun3:#6d4bd8;--moon1:#1d2a5e;--moon2:#3a2a6e;--moon3:#0f1530}
body{transition:background .4s}
body.morgen{background:radial-gradient(120% 60% at 50% -10%,#3a2433 0%,var(--bg) 60%) fixed}
body.abend{background:radial-gradient(120% 60% at 50% -10%,#1d2347 0%,#0b0d16 60%) fixed}
h1{font-size:31px;letter-spacing:-.5px}
.hero{border-radius:24px;padding:20px 18px 18px;margin:16px 0 4px;position:relative;overflow:hidden;
  background:linear-gradient(140deg,var(--sun1),var(--sun2) 55%,var(--sun3));box-shadow:0 10px 30px rgba(232,87,126,.25)}
.hero.abend{background:linear-gradient(140deg,var(--moon2),var(--moon1) 55%,var(--moon3));box-shadow:0 10px 30px rgba(58,42,110,.35)}
.hero .big{position:absolute;right:14px;top:8px;font-size:64px;opacity:.9}
.hero .lbl{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.8}
.hero .ttl{font-size:26px;font-weight:800;margin:4px 0 2px;letter-spacing:-.4px}
.hero .meta{font-size:14px;opacity:.85;margin-bottom:12px}
.hero .chips{display:flex;flex-wrap:wrap;gap:6px}
.hero .chips span{font-size:13px;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px}
.vtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 0}
.vtiles button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:16px;background:var(--surface);min-height:0}
.vtiles button .ic{font-size:26px}
.vtiles button b{font-size:16px}
.vtiles button span{font-size:12px;color:var(--muted)}
.vtiles button.sel{outline:2px solid #ffb27a;background:#2a1f2a}
body.abend .vtiles button.sel{outline-color:#9d8cff;background:#1f1d3a}
.woche{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.woche div{background:var(--surface);border-radius:12px;padding:7px 0 7px;text-align:center;font-size:11px;color:var(--muted)}
.woche div b{display:block;font-size:16px;color:var(--text);margin:1px 0 3px}
.woche div i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2a2f3b;margin:0 1px}
.woche div i.m{background:#ffb27a}.woche div i.a{background:#9d8cff}
.woche .heute{outline:2px solid rgba(255,255,255,.35)}
.wochetxt{font-size:13px;color:var(--muted);margin:8px 2px 0}
details.card summary{cursor:pointer;color:var(--muted);font-size:15px;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:8px}
#btnStart{background:linear-gradient(90deg,var(--sun1),var(--sun2));color:#1a0b12;font-weight:800;min-height:58px;font-size:19px;box-shadow:0 8px 24px rgba(232,87,126,.3)}
body.abend #btnStart{background:linear-gradient(90deg,#8f7bff,#5b6cff);color:#0b0d1e;box-shadow:0 8px 24px rgba(91,108,255,.3)}
/* Lauf */
.bar{height:8px}
.bar i{background:linear-gradient(90deg,var(--sun1),var(--sun2))}
body.abend .bar i{background:linear-gradient(90deg,#8f7bff,#5b6cff)}
.emoji{width:132px;height:132px;margin:16px auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:70px;
  background:radial-gradient(circle,rgba(255,178,122,.28),rgba(255,178,122,0) 70%)}
body.abend .emoji{background:radial-gradient(circle,rgba(157,140,255,.3),rgba(157,140,255,0) 70%)}
.liste{border:1px solid #262a35}
.liste li .n{width:26px;height:26px;border-radius:50%;background:#2a2340;color:#ffb27a;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
body.abend .liste li .n{background:#24224a;color:#b9adff}
.fig{border:1px solid #262a35}
.name{font-size:29px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
.tile{border-radius:18px;padding:14px}
.tile .v{font-size:27px;font-weight:800;letter-spacing:-.5px}
.tile .v small{font-size:15px;font-weight:600}
.tile .l{font-size:13px;opacity:.75;margin-top:2px}
.tile.a{background:#3a2433}.tile.b{background:#163626}.tile.c{background:#1f2a4a}.tile.d{background:#2c2142}
/* ===== Abend Schritt für Schritt ===== */
.phasen{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 2px}
.phasen div{text-align:center;font-size:11px;color:var(--muted);padding:6px 0 7px;border-radius:12px;background:var(--surface)}
.phasen div span{display:block;font-size:20px;margin-bottom:1px;filter:grayscale(1);opacity:.55}
.phasen div.akt{background:#24224a;color:#d9d2ff;box-shadow:inset 0 0 0 1.5px #8f7bff}
.phasen div.akt span,.phasen div.done span{filter:none;opacity:1}
.phasen div.done{color:#b9adff}
.stepcard{margin:14px 0 0;border-radius:24px;padding:22px 20px;background:linear-gradient(160deg,#211f42,#151729);border:1px solid #2e2b5a;text-align:center}
.stepcard .sicon{width:110px;height:110px;margin:0 auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:58px;
  background:radial-gradient(circle,rgba(157,140,255,.35),rgba(157,140,255,0) 70%)}
.stepcard .snr{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#b9adff}
.stepcard .stitel{font-size:26px;font-weight:800;letter-spacing:-.4px;margin:6px 0 8px}
.stepcard .stext{font-size:17px;color:#cfd3ea;line-height:1.45}
.stepcard .stipp{margin-top:14px;font-size:14px;color:#a7a2d6;background:rgba(255,255,255,.05);border-radius:12px;padding:9px 12px}
.mini{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:12px}
.mini .zeit{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;min-width:96px}
.mini button{min-height:44px;border-radius:999px;padding:10px 18px;background:#2e2b5a;color:#e7e3ff;font-weight:600}
.mini.laeuft .zeit{color:#b9adff}
body.abend #s-run .phase{display:none}
/* ===== Apple-Look (iOS Dark, System-Farben, flach) ===== */
:root{
  --bg:#000; --surface:#1c1c1e; --surface2:#2c2c2e; --fill:rgba(118,118,128,.24);
  --text:#fff; --muted:rgba(235,235,245,.6); --muted2:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --orange:#ff9f0a; --indigo:#5e5ce6; --green:#30d158; --blue:#0a84ff; --red:#ff453a;
  --prep:var(--orange); --hold:var(--green); --accent:var(--orange); --danger:var(--red);
}
body.abend{--accent:#7d7aff}
html,body{font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
body,body.morgen,body.abend{background:#000}
h1{font-size:34px;font-weight:700;letter-spacing:-.6px;margin:18px 0 2px}
#today{font-size:15px}
.card{background:var(--surface);border-radius:12px;padding:14px 16px;border:0}
button{border-radius:12px;background:var(--surface2);min-height:50px;font-weight:500}
button.primary,#btnStart,body.abend #btnStart{background:var(--accent);color:#fff;font-weight:600;font-size:17px;box-shadow:none;min-height:52px;border-radius:14px}
button.ok{background:var(--green);color:#fff;font-weight:600;font-size:17px}
button.ghost{background:transparent;color:var(--accent);font-weight:400}
#btnAbort{color:var(--muted)}
button.sel{outline:0}
select,input{background:var(--surface2);border-radius:10px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0}
/* Woche */
.woche{gap:0;margin-top:16px}
.woche div{background:transparent;border-radius:0;padding:4px 0;color:var(--muted)}
.woche div b{width:32px;height:32px;line-height:32px;border-radius:50%;margin:3px auto 4px;font-size:17px;font-weight:500}
.woche .heute{outline:0}
.woche .heute b{background:var(--accent);color:#fff;font-weight:600}
.woche div i{width:5px;height:5px;background:var(--surface2)}
.woche div i.m{background:var(--orange)}.woche div i.a{background:var(--indigo)}
.wochetxt{font-size:13px;margin:6px 0 0;color:var(--muted)}
/* Hero = gruppierte Zelle */
.hero,.hero.abend{background:var(--surface);box-shadow:none;border-radius:12px;padding:14px 16px 16px;margin:18px 0 0}
.hero .big{display:none}
.hero .lbl{font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--accent);opacity:1}
.hero .ttl{font-size:28px;font-weight:700;letter-spacing:-.5px;margin:2px 0 0}
.hero .meta{font-size:15px;color:var(--muted);opacity:1;margin:2px 0 12px}
.hero .chips{gap:6px}
.hero .chips span{background:var(--fill);color:rgba(235,235,245,.85);font-size:13px;border-radius:7px;padding:4px 8px}
/* Varianten = Segmented Control */
.vtiles{gap:2px;margin:16px 0 0;background:var(--fill);border-radius:10px;padding:2px}
.vtiles button,.vtiles button.sel,body.abend .vtiles button.sel{background:transparent;outline:0;border-radius:8px;padding:6px 4px;min-height:0;gap:0}
.vtiles button.sel,body.abend .vtiles button.sel{background:#636366;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.vtiles button .ic{display:none}
.vtiles button b{font-size:15px;font-weight:600}
.vtiles button span{font-size:11px;color:var(--muted)}
details.card summary{color:var(--text);font-size:17px}
/* Lauf */
.top{margin-top:8px}
.bar{height:4px;border-radius:2px;background:var(--surface2)}
.bar i,body.abend .bar i{background:var(--accent)}
.phase,.phase.prep,.phase.hold,.phase.check,.phase.pause{background:transparent;padding:0;font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;margin-top:20px}
.phase.prep{color:var(--orange)}.phase.hold{color:var(--green)}.phase.check{color:var(--accent)}.phase.pause{color:var(--red)}
.name{font-size:28px;font-weight:700;letter-spacing:-.5px}
.side{color:var(--orange);font-size:17px}
.phasen{gap:2px;background:var(--fill);border-radius:10px;padding:2px;margin:14px 0 0}
.phasen div{background:transparent;border-radius:8px;font-size:13px;font-weight:500;padding:7px 0;color:var(--muted)}

<body>

<!-- START -->
<section id="s-start" class="screen on">
  <h1 id="gruss">Guten Morgen, Noah</h1>
  <div class="muted" id="today"></div>
  <div class="woche" id="woche"></div><div class="wochetxt" id="wochetxt"></div>
  <div class="card hidden" id="ringeCard"></div>
  <div class="hero" id="hero"></div>
  <div class="vtiles">
    <button data-v="kurz" class="vbtn"><span class="ic">☀️</span><b>Kurz</b><span id="durKurz"></span></button>
    <button data-v="lang" class="vbtn"><span class="ic">🌄</span><b>Lang</b><span id="durLang"></span></button>
    <button data-v="abend" class="vbtn"><span class="ic">🌙</span><b>Abend</b><span id="durAbend"></span></button>
  </div>
  <button class="linkbtn" id="btnBuero">🪑 Büro-Pause · Stuhl &amp; Stehen <span id="durBuero"></span></button>
  <div id="jetzt"></div>
  <div class="card hidden" id="losCard"></div>
  <div class="card hidden" id="befehlCard"></div>
  <div class="card hidden" id="pjCard"></div>
  <div class="card hidden" id="wocheCard"></div>
  <div class="card" id="glowCard"></div>
  <input type="file" id="fotoIn" accept="image/*" capture="user" style="display:none">
  <div class="card hidden" id="putzCard"></div>
  <div class="card hidden" id="termineCard"></div>
  <div class="card hidden" id="reiseCard"></div>
  <div class="card hidden" id="fechtCard"></div>
  <div class="card hidden" id="schritteCard"></div>
  <div class="card hidden" id="heuteCard"></div>
  <div class="card hidden" id="gewCard"></div>
  <div class="card hidden" id="kalCard"></div>

  <div class="card" id="resume" style="display:none">
    <div>Angefangene Routine von <b id="resumeTime"></b> gefunden.</div>
    <div class="seg" style="margin-top:10px">
      <button class="primary" id="btnResume">Fortsetzen</button>
      <button class="ghost" id="btnDiscard">Verwerfen</button>
    </div>
  </div>

  <div class="sekt hidden" id="mehrKopf">Mehr</div>
  <div id="mehr"></div>

  <details class="card">
    <summary>⚙︎ Einstellungen</summary>
    <label class="row"><span>Stimme</span><input type="checkbox" id="optVoice" checked></label>
    <select id="voiceSel"></select>
    <label class="row"><span>Signaltöne</span><input type="checkbox" id="optBeep" checked></label>
    <button class="ghost small" id="btnTest" style="width:100%">Stimme &amp; Ton testen</button>
    <label class="row" style="margin-top:14px"><span>Wegzeit zum 1. Termin (Min.)</span><input id="setWeg" type="number" inputmode="numeric" min="0" max="240" style="width:80px"></label>
    <label class="row"><span>Puffer (Min.)</span><input id="setPuffer" type="number" inputmode="numeric" min="0" max="120" style="width:80px"></label>
    <label class="row"><span>Wetter-Ort (ohne Reise)</span><select id="setOrt" style="width:auto"><option>Innsbruck</option><option>Kufstein</option><option>Wien</option></select></label>
    <div class="muted small" style="margin-top:14px">Schritte ausblenden (✓ = weg)</div><div id="setAus"></div>
    <label class="row" style="margin-top:14px"><span>Termin-Schlüssel</span></label>
    <input id="tkey" type="password" placeholder="einfügen" autocomplete="off">
  </details>

  <div class="grow"></div>
  <div class="bottom">
    <button class="primary" id="btnStart">Start</button>
  </div>
</section>

<!-- LAUF -->
<section id="s-run" class="screen">
  <div class="top">
    <span class="muted small" id="stepCount"></span>
    <span class="muted small" id="clock"></span>
  </div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="phasen hidden" id="phasen"></div>

  <div style="text-align:center">
    <span class="phase" id="phase"></span>
    <div class="name" id="name"></div>
    <div class="side" id="side"></div>
  </div>

  <!-- Übung -->
  <div id="exView" class="exrow">
    <div class="fig" id="fig"></div>
    <div class="ringwrap">
      <svg viewBox="0 0 240 240">
        <circle cx="120" cy="120" r="108" fill="none" stroke="#222632" stroke-width="14"/>
        <circle id="ring" cx="120" cy="120" r="108" fill="none" stroke="#4cc38a" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="678.6" stroke-dashoffset="0"/>
      </svg>
      <div class="num" id="num">0</div>
    </div>
  </div>

  <!-- Schritt (Abend) -->
  <div id="stepView" class="hidden">
    <div class="stepcard">
      <div class="sicon" id="sIcon"></div>
      <div class="snr" id="sNr"></div>
      <div class="stitel" id="sTitel"></div>
      <div class="stext" id="sText"></div>
      <div class="stipp hidden" id="sTipp"></div>
      <div class="mini hidden" id="mini"><span class="zeit" id="miniZeit">0:30</span><button id="miniBtn">▶ Timer</button></div>
    </div>
  </div>

  <!-- Checkliste -->
  <div id="checkView" class="hidden">
    <div class="emoji" id="emoji"></div>
    <ul class="liste hidden" id="liste"></ul>
    <div class="mini hidden" id="cmini" style="margin-top:12px"><span class="zeit" id="cminiZeit">0:00</span><span class="muted small" id="cminiTxt" style="flex:1;margin:0 10px"></span><button id="cminiBtn">▶ Timer</button></div>
    <div class="fig hidden" id="repFig" style="max-width:260px;margin:10px auto 0"></div>
    <div class="reps hidden" id="repsBox">
      <button id="repMinus">−</button><b id="repNum">10</b><button id="repPlus">+</button>
    </div>
    <div class="card" id="kgBox">
      <div class="muted small">Gewicht in kg</div>
      <input id="kg" class="kg" inputmode="decimal" placeholder="z. B. 94,6" autocomplete="off">
    </div>
    <div class="card hidden" id="bauchBox">
      <div class="muted small">Bauchumfang in cm – 3 Messungen</div>
      <div style="display:flex;gap:8px"><input id="b1" class="kg" style="width:33%;font-size:26px" inputmode="decimal" placeholder="1." autocomplete="off"><input id="b2" class="kg" style="width:33%;font-size:26px" inputmode="decimal" placeholder="2." autocomplete="off"><input id="b3" class="kg" style="width:33%;font-size:26px" inputmode="decimal" placeholder="3." autocomplete="off"></div>
      <div class="muted small" id="bauchMittel" style="text-align:center;margin-top:8px"></div>
    </div>
  </div>

  <div class="cue" id="cue" style="text-align:center"></div>
  <div class="next" id="next" style="text-align:center"></div>

  <div class="grow"></div>
  <div class="bottom">
    <div class="ctrl" id="exCtrl">
      <button id="btnBack">◀︎ Zurück</button>
      <button id="btnPause">Pause</button>
      <button id="btnSkip">Weiter ▶︎</button>
    </div>
    <div class="seg hidden" id="checkCtrl">
      <button class="ghost" id="btnNo">Auslassen</button>
      <button class="ok" id="btnDone">Erledigt ✓</button>
    </div>
    <button class="ghost small" id="btnAbort">Routine beenden</button>
  </div>
</section>

<!-- ENDE -->
<section id="s-end" class="screen">
  <h1 id="endTitel">Fertig 💪</h1>
  <div class="muted" id="endSub"></div>
  <div id="endRing"></div>
  <div class="tiles" id="tiles"></div>
  <div class="card sum" id="sum"></div>
  <div class="grow"></div>
  <div class="bottom">
    <button class="primary" id="btnSend">An Jarvis senden</button>
    <button id="btnCopy">Text kopieren</button>
    <pre id="logText"></pre>
    <button class="ghost" id="btnHome">Zur Startseite</button>
  </div>
</section>

function figTeile(svg){
  const out=[], re=/<(polyline|circle|path|line|text)\b([^>]*?)(?:\/>|>([^<]*)<\/text>)/g; let m;
  while((m=re.exec(svg))){ if(/class="ar"/.test(m[2])) continue; out.push({tag:m[1],attr:m[2],txt:m[3]}); }
  return out;
}
const ATTR={polyline:["points"],circle:["cx","cy"],path:["d"],line:["x1","y1","x2","y2"]};
const wert=(a,n)=>{const m=a.match(new RegExp(`\\b${n}="([^"]*)"`));return m?m[1]:null};

function animFig(id){
  const A=FIG[id]; let Bs=FIGB[id]; if(!A||!Bs) return null;
  if(!Array.isArray(Bs)) Bs=[Bs];
  const a=figTeile(A), statisch=a.filter(x=>x.tag==="text"), ka=a.filter(x=>x.tag!=="text");
  const bs=Bs.map(b=>figTeile(b).filter(x=>x.tag!=="text"));
  if(bs.some(b=>b.length!==ka.length||b.some((x,i)=>x.tag!==ka[i].tag))) return null;
  const dur=ANIM_DAUER[id]||(Bs.length>1?3.6:3), n=Bs.length+1;
  const kt=(id==="atmung"||id==="atmungAbend")?"0;0.4;1":Array.from({length:n+1},(_,i)=>(i/n).toFixed(3)).join(";");
  const ks=Array(n).fill(".42 0 .58 1").join(";");
  let body="";
  ka.forEach((x,i)=>{
    let anim="";
    ATTR[x.tag].forEach(at=>{
      const v=[wert(x.attr,at),...bs.map(b=>wert(b[i].attr,at)),wert(x.attr,at)];
      if(v.some(z=>z===null)||v.every(z=>z===v[0])) return;
      anim+=`<animate attributeName="${at}" values="${v.join(";")}" keyTimes="${kt}" calcMode="spline" keySplines="${ks}" dur="${dur}s" repeatCount="indefinite"/>`;
    });
    body+=anim?`<${x.tag}${x.attr}>${anim}</${x.tag}>`:`<${x.tag}${x.attr}/>`;
  });
  statisch.forEach(x=>body+=`<text${x.attr}>${x.txt}</text>`);
  return `<svg viewBox="0 0 120 96" aria-hidden="true">${body}</svg>`;
}

function isoLocal(d){

  m.innerHTML=`<div class="v42bg"></div><div class="v42box">${titel?`<div class="v42t">${titel}</div>`:""}${items.map((x,i)=>x.trenner?`<div class="v42sep"></div>`:`<button data-i="${i}" class="${x.an?"an":""}">${x.icon?ICO(x.icon):""}<span>${x.label}${x.sub?`<small>${x.sub}</small>`:""}</span>${x.an?`<i>✓</i>`:""}</button>`).join("")}</div>`;
  document.body.appendChild(m); const box=m.querySelector(".v42box"), w=Math.min(300,innerWidth-24);
  box.style.width=w+"px"; let x=Math.min(Math.max(12,r.left),innerWidth-w-12), y=r.bottom+6;
  const h=box.offsetHeight; if(y+h>innerHeight-90) y=Math.max(12,r.top-h-6); box.style.left=x+"px"; box.style.top=y+"px";
  requestAnimationFrame(()=>m.classList.add("auf"));
  m.querySelector(".v42bg").onclick=v42Zu;
  m.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{const it=items[+b.dataset.i]; if(!it.offen) v42Zu(); try{it.tun&&it.tun()}catch(e){console.error(e)}});}
function v42Zu(){const m=$("v42menu"); if(m) m.remove()}
document.addEventListener("keydown",e=>{if(e.key==="Escape") v42Zu()});
/* Eiweiß direkt eintragen (wie Schnellknöpfe) */
function v42Ew(k){const x=EWK.find(y=>y.k===k); if(!x) return; const now=new Date(), tag=ewTag(), t=Date.now().toString(36);
  const l=store.get("ewlok-"+tag)||[]; l.push({t,k,e:x.e,kc:x.kc}); store.set("ewlok-"+tag,l);
  jarvisSend(`Essen; key=${k}; t=${t}; datum=${tag}; zeit=${hm(now)};`); try{pjRender(); ringeRender()}catch(e){} setTimeout(()=>v37Toast(`✓ ${x.n} eingetragen (+${x.e} g)`),300)}
function v42Schnell(){const jd=$("jdCard"); if(!jd||jd.querySelector(".v42schnell")) return;
  const vl={kurz:"Kurz",lang:"Lang",abend:"Abend"}[variante]||"Kurz";
  jd.insertAdjacentHTML("beforeend",`<div class="v42schnell"><button data-m="ew">${ICO("plus")}Eiweiß<i>▾</i></button><button data-m="var">${ICO("list")}${vl}<i>▾</i></button><button data-m="notiz">${ICO("note")}Notiz</button></div>`);
  jd.querySelector('[data-m="ew"]').onclick=e=>{e.stopPropagation(); const p=TERMINE&&TERMINE.pj, ist=p?(p.eiweiss||0)+ewLokal(p).e:null;
    v42Menu(e.currentTarget,`Eiweiß eintragen${ist!=null?` · heute ${ist} / 165 g`:""}`,EWK.map(x=>({label:x.n,sub:`+${x.e} g · ${x.kc} kcal`,tun:()=>v42Ew(x.k)})))};
  jd.querySelector('[data-m="var"]').onclick=e=>{e.stopPropagation();
    v42Menu(e.currentTarget,"Routine wählen",[["kurz","Morgen kurz","sun"],["lang","Morgen lang","sunrise"],["abend","Abend","moon"]].map(([v,l,i])=>({label:l,sub:`ca. ${dauerMin(v)} Min.`,icon:i,an:variante===v,tun:()=>{v37Manuell=true; v37Auto=false; variante=v; markV(); jdRender()}}))
      .concat([{trenner:1},{label:"Büro-Pause",sub:"Stuhl & Stehen",icon:"chair",tun:()=>$("btnBuero").click()},{label:"Jetzt starten",icon:"play",tun:()=>$("btnStart").click()}]))};
  jd.querySelector('[data-m="notiz"]').onclick=e=>{e.stopPropagation(); $("v37fab").click()};}
var _v42jd=jdRender; jdRender=function(){_v42jd(); try{v42Schnell()}catch(e){}};
/* Termin-Aktionen im Tagesablauf */
function v42Termine(){const tc=$("termineCard"); if(!tc||!TERMINE||!TERMINE.termine) return;
  tc.querySelectorAll("details.tdd").forEach((d,i)=>{const t=TERMINE.termine[i]; if(!t||d.querySelector(".v42akt")) return;
    const ok=/^\d\d:\d\d$/.test(t.zeit), kurz=String(t.titel).replace(/\s*\(Christofer\)$/,"");
    d.insertAdjacentHTML("beforeend",`<div class="v42akt">${ok?`<button data-er="${esc(t.zeit)}">${ICO("bell")}Erinnern ▾</button>`:""}<a href="maps://?q=${encodeURIComponent(kurz)}">${ICO("pin")}Karte</a></div>`);
    const b=d.querySelector("[data-er]"); if(b) b.onclick=e=>{e.preventDefault(); e.stopPropagation(); const [h,m]=t.zeit.split(":").map(Number);
      v42Menu(b,`Erinnern an „${esc(kurz)}“`,[15,30,60].map(min=>{const z=new Date(); z.setHours(h,m-min,0,0); return {label:`${min} Min. vorher`,sub:`um ${hm(z)} per Telegram`,icon:"bell",
        tun:()=>{if(z<new Date()){v37Toast("Zeitpunkt ist schon vorbei",true); return} jarvisSend(`Notiz: Erinnere mich heute um ${hm(z)} an „${kurz}“ (Termin ${t.zeit}).`)}}}))};});}
var _v42tr=termineRender; termineRender=function(){_v42tr(); try{v42Termine(); v42Schnell()}catch(e){console.error(e)}};
/* Kopf-Menü */
function v42Kopf(){const b=$("v35Set"); if(!b) return; b.onclick=e=>{e.stopPropagation(); const th=document.documentElement.dataset.theme;
  v42Menu(b,"Helfer",[{label:"Systemstatus",sub:v37Problem()?"⚠︎ bitte prüfen":"alles in Ordnung",icon:"pulse",tun:()=>{v35Tab("mehr"); setTimeout(()=>$("v37stat")?.scrollIntoView({behavior:"smooth"}),50)}},
    {label:"Chat mit Jarvis",icon:"chat",tun:()=>location.href=V38_CHATS[0][1]},{label:"Ernährungsbot",icon:"scale",tun:()=>location.href=V38_CHATS[1][1]},{label:"Schiri",icon:"flag",tun:()=>location.href=V38_CHATS[2][1]},
    {trenner:1},...[["clean","Apple-clean"],["premium","Premium"],["tirol","Tirol"]].map(([k,l])=>({label:"Darstellung: "+l,icon:"sparkle",an:th===k,tun:()=>v35Theme(k)})),
    {trenner:1},{label:"Daten sichern",icon:"save",tun:()=>v38Sichern()},{label:"Alle Einstellungen",icon:"sliders",tun:()=>v35Tab("mehr")}])}}
try{
  Object.assign(V35_ICONS,{plus:'<path d="M12 5v14M5 12h14"/>',bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/>',pin:'<path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>'});
  const sp=document.querySelector('svg[aria-hidden="true"][width="0"]'); if(sp) ["plus","bell","pin"].forEach(n=>{if(!sp.querySelector("#i-"+n)) sp.insertAdjacentHTML("beforeend",`<symbol id="i-${n}" viewBox="0 0 24 24">${V35_ICONS[n]}</symbol>`)});
  const ch=document.querySelector('#v38chats a.v38chat'); if(ch) ch.href=V38_CHATS[0][1];
  v42Kopf(); v42Schnell(); v42Termine();
  const vv=document.querySelector(".v35vers"); if(vv) vv.textContent="Helfer v42";
}catch(e){console.error("v42",e)}
/* ---------- v43: Abend-Feinschliff + Nutzungsstatistik ---------- */
/* Zusammenfassungen: Beschriftung und Wert mit Trenner */
var v43Zeile=r=>{if(!r) return ""; const s=r.querySelector("span"), b=r.querySelector("b"); return s&&b?`${s.textContent.trim()}: ${b.textContent.trim()}`:r.textContent};
var _v43sum=v40Summen;
v40Summen=function(){_v43sum(); try{["schritteCard","putzCard","losCard"].forEach(id=>{const c=$(id), s=c&&c.querySelector(":scope>.v40sum"), r=c&&c.querySelector(".orow"); if(s&&r){const t=v40Kurz(v43Zeile(r)); if(s.textContent!==t) s.textContent=t}})}catch(e){}};
/* Abends: Termine, die noch kommen, bleiben in „Heute“; „Morgen anziehen“ offen */
function v43Abend(){const h=new Date().getHours(), ab=variante==="abend"||h>=17; if(!ab) return;
  const tc=$("termineCard"), j=$("jetzt"); if(tc&&j&&TERMINE&&TERMINE.termine){const now=new Date();
    const rest=TERMINE.termine.filter(t=>{const m=String(t.zeit).match(/^(\d\d):(\d\d)/); if(!m) return false; const d=new Date(); d.setHours(+m[1],+m[2],0,0); return d>now});
    if(rest.length&&tc.parentElement!==j){j.insertBefore(tc,j.querySelector(".card.zu")||null); tc.classList.remove("zu")}}
  const z2=store.get("zu2")||{}; const hc=$("heuteCard"); if(hc&&!("heuteCard" in z2)) hc.classList.remove("zu");}
var _v43za=v40ZuAnwenden; v40ZuAnwenden=function(){_v43za(); try{const h=new Date().getHours(); if(variante==="abend"||h>=17){const z2=store.get("zu2")||{}, hc=$("heuteCard"); if(hc&&!("heuteCard" in z2)) hc.classList.remove("zu")}}catch(e){}};
var _v43ord=ordnen; ordnen=function(){_v43ord(); try{v43Abend(); v41Gruppen(true); v40Summen()}catch(e){}};
/* Nutzungsstatistik – bleibt nur auf diesem Gerät */
function v43Log(k){try{const n=store.get("nutzung")||{seit:isoLocal(new Date()).slice(0,10),z:{}}; n.z[k]=(n.z[k]||0)+1; store.set("nutzung",n)}catch(e){}}
document.addEventListener("click",e=>{const t=e.target; let k=null;
  const kopf=t.closest("#jetzt .ckopf,#mehr .ckopf,#jetzt .v40sum"); if(kopf){const c=kopf.closest(".card"); if(c&&c.id) setTimeout(()=>{if(!c.classList.contains("zu")) v43Log("Aufgeklappt: "+v43Name(c))},20)}
  if(t.closest(".tabbar button")) k="Tab: "+t.closest(".tabbar button").innerText.trim();
  else if(t.closest(".v42schnell [data-m]")) k="Schnellknopf: "+({ew:"Eiweiß",var:"Routine wählen",notiz:"Notiz"})[t.closest("[data-m]").dataset.m];
  else if(t.closest("#v42menu button[data-i]")) k="Menü: "+t.closest("button").querySelector("span").firstChild.textContent.trim();
  else if(t.closest("#jdBtn")) k="Jetzt dran: "+t.closest("#jdBtn").textContent.trim();
  else if(t.closest("#btnStart")) k="Routine gestartet";
  else if(t.closest("#v37go")) k="Notiz gesendet";
  else if(t.closest("#v37fab")) k="Notiz-Knopf";
  else if(t.closest("button[data-ew]")) k="Eiweiß-Knopf (PJ-Karte)";
  else if(t.closest("button[data-tid]")) k="Termin-Status gesetzt";
  else if(t.closest(".v42akt a")) k="Termin: Karte";
  else if(t.closest(".v40zug")) k="Zug-Alternativen";
  else if(t.closest(".v40mini")) k="Mini-Ringe";
  else if(t.closest("[data-reise]")) k="Reise beantwortet";
  else if(t.closest(".v38chat")) k="Chat: "+t.closest(".v38chat").innerText.trim();
  if(k) v43Log(k);},true);
function v43Name(c){const k=c.querySelector(".ckopf"); return k?[...k.childNodes].filter(n=>n.nodeType===3).map(n=>n.nodeValue).join("").trim()||c.id:c.id}
function v43Karte(){const p=$("tabMehr"); if(!p) return; let el=$("v43nutz"); if(!el){const d=$("v38daten"); (d||p.lastElementChild).insertAdjacentHTML(d?"beforebegin":"beforebegin",`<details class="card" id="v43nutz"></details>`); el=$("v43nutz")}
  const n=store.get("nutzung")||{seit:isoLocal(new Date()).slice(0,10),z:{}}, L=Object.entries(n.z).sort((a,b)=>b[1]-a[1]);
  const alle=["Schnellknopf: Eiweiß","Schnellknopf: Routine wählen","Schnellknopf: Notiz","Notiz-Knopf","Zug-Alternativen","Mini-Ringe","Termin: Karte","Termin-Status gesetzt","Tab: Routine","Tab: Fortschritt","Tab: Mehr"];
  const nie=alle.filter(x=>!n.z[x]), tage=Math.max(1,Math.round((Date.now()-new Date(n.seit+"T00:00").getTime())/864e5));
  el.innerHTML=`<summary>${ICO("chart")}Meine Nutzung <span style="margin-left:auto;font-size:13px;font-weight:400;color:var(--muted)">seit ${n.seit.slice(8,10)}.${n.seit.slice(5,7)}. · ${tage} Tag${tage>1?"e":""}</span></summary>
    <div class="onote muted" style="margin:8px 0">Bleibt nur auf diesem Handy. Nach einer Woche zeig mir das – dann räumen wir auf.</div>`
    +(L.length?L.slice(0,15).map(([k,v])=>`<div class="orow v43z"><span>${esc(k)}</span><b>${v}×</b></div>`).join(""):`<div class="onote">Noch nichts erfasst.</div>`)
    +(nie.length?`<div class="onote" style="margin-top:10px"><b>Noch nie benutzt:</b> ${nie.map(x=>esc(x.replace(/^.*?: /,""))).join(" · ")}</div>`:"")
    +`<button class="tsend" id="v43reset" style="margin-top:10px">Zählung neu starten</button>`;
  $("v43reset").onclick=()=>{if(confirm("Nutzung zurücksetzen?")){store.set("nutzung",{seit:isoLocal(new Date()).slice(0,10),z:{}}); v43Karte()}};}
var _v43tab=v35Tab; v35Tab=function(t){_v43tab(t); if(t==="mehr") try{v43Karte()}catch(e){}};
try{
  if(!store.get("nutzung")) store.set("nutzung",{seit:isoLocal(new Date()).slice(0,10),z:{}});
  v43Abend(); v41Gruppen(true); v40Summen(); v43Karte();
  const vv=document.querySelector(".v35vers"); if(vv) vv.textContent="Helfer v43";
}catch(e){console.error("v43",e)}
</script>
