<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morgen">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Morgenroutine</title>
<style>
:root{
  --bg:#0f1115; --surface:#181b22; --surface2:#222632; --text:#eef0f3; --muted:#9aa3ae;
  --prep:#f2b84b; --hold:#4cc38a; --accent:#7aa2ff; --danger:#e5675f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;}
body{padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);overscroll-behavior:none}
.screen{display:none;min-height:100%;flex-direction:column;max-width:520px;margin:0 auto}
.screen.on{display:flex}
h1{font-size:28px;margin:22px 0 4px;letter-spacing:-.3px}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--surface);border-radius:16px;padding:16px;margin:12px 0}
.seg{display:flex;gap:8px}
.seg button{flex:1}
button{font:inherit;color:var(--text);background:var(--surface2);border:0;border-radius:14px;
  padding:14px 12px;min-height:52px;cursor:pointer}
button.sel{outline:2px solid var(--accent);background:#263049}
button.primary{background:var(--accent);color:#0b0f1a;font-weight:600;font-size:19px}
button.ok{background:var(--hold);color:#06150d;font-weight:600;font-size:19px}
button.ghost{background:transparent;color:var(--muted)}
button:disabled{opacity:.4}
select,input{font:inherit;color:var(--text);background:var(--surface2);border:0;border-radius:12px;
  padding:12px;width:100%}
label.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0}
label.row input[type=checkbox]{width:24px;height:24px}
.grow{flex:1}
.bottom{padding:12px 0 16px;display:grid;gap:10px}
/* Lauf */
.top{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin:10px 0 0}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.phase{display:inline-block;font-size:14px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;margin-top:18px}
.phase.prep{background:#3b2f14;color:var(--prep)}
.phase.hold{background:#123323;color:var(--hold)}
.phase.check{background:#1c2540;color:var(--accent)}
.phase.pause{background:#3a1d1b;color:var(--danger)}
.name{font-size:30px;font-weight:700;margin:10px 0 2px;letter-spacing:-.3px}
.side{font-size:20px;color:var(--prep);font-weight:600;min-height:28px}
.exrow{display:flex;gap:12px;align-items:center;margin:12px 0 4px}
.fig{flex:1.25;background:var(--surface);border-radius:16px;padding:6px;min-width:0}
.fig svg{width:100%;height:auto;display:block}
.fig polyline,.fig line,.fig path.ln{fill:none;stroke:#eef0f3;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.fig .hd{fill:#eef0f3}
.fig path.ar{fill:none;stroke:#7aa2ff;stroke-width:2.5;stroke-linecap:round}
.fig line.fl{stroke:#3a4150;stroke-width:2}
.fig line.bd{stroke:#e5675f;stroke-width:3}
.fig line.st{stroke:#9aa3ae;stroke-width:5}
.fig text{fill:#7aa2ff;font-size:12px;font-weight:700}
.emoji{font-size:84px;text-align:center;margin:14px 0 4px}
.liste{list-style:none;padding:0;margin:8px 0 0;background:var(--surface);border-radius:16px}
.liste li{padding:12px 14px;border-bottom:1px solid #262a35;font-size:17px;display:flex;gap:10px;align-items:baseline}
.liste li:last-child{border:0}
.liste li .n{color:var(--accent);font-weight:700;min-width:18px}
.liste li small{display:block;color:var(--muted);font-size:13px}
.liste li.kauf{color:var(--muted)}
.liste li.kopf{font-size:13px;color:var(--muted);padding:10px 14px 6px}
body.nacht{background:#000!important}
body.nacht #s-run{opacity:.45}
.reps{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:6px}
.reps button{width:64px;font-size:28px}
.reps b{font-size:56px;min-width:80px;text-align:center;font-variant-numeric:tabular-nums}
.exrow .ringwrap{flex:1;width:auto;margin:0}
.exrow .ringwrap .num{font-size:52px}
.ringwrap{position:relative;width:min(70vw,260px);aspect-ratio:1;margin:14px auto 6px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:84px;font-weight:700;font-variant-numeric:tabular-nums}
.cue{font-size:18px;color:#cfd5dc;margin:4px 0 0}
.next{font-size:15px;color:var(--muted);margin-top:12px}
.ctrl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.ctrl button{white-space:nowrap;padding:14px 6px}
.kg{font-size:34px;text-align:center;font-weight:700;margin-top:12px}
.sum div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #262a35}
.sum div:last-child{border:0}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:var(--muted);background:var(--surface);
  padding:10px;border-radius:12px}
.hidden{display:none!important}
/* ===== Design ===== */
:root{--sun1:#ff9a5a;--sun2:#e8577e;--sun3:#6d4bd8;--moon1:#1d2a5e;--moon2:#3a2a6e;--moon3:#0f1530}
body{transition:background .4s}
body.morgen{background:radial-gradient(120% 60% at 50% -10%,#3a2433 0%,var(--bg) 60%) fixed}
body.abend{background:radial-gradient(120% 60% at 50% -10%,#1d2347 0%,#0b0d16 60%) fixed}
h1{font-size:31px;letter-spacing:-.5px}
.hero{border-radius:24px;padding:20px 18px 18px;margin:16px 0 4px;position:relative;overflow:hidden;
  background:linear-gradient(140deg,var(--sun1),var(--sun2) 55%,var(--sun3));box-shadow:0 10px 30px rgba(232,87,126,.25)}
.hero.abend{background:linear-gradient(140deg,var(--moon2),var(--moon1) 55%,var(--moon3));box-shadow:0 10px 30px rgba(58,42,110,.35)}
.hero .big{position:absolute;right:14px;top:8px;font-size:64px;opacity:.9}
.hero .lbl{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.8}
.hero .ttl{font-size:26px;font-weight:800;margin:4px 0 2px;letter-spacing:-.4px}
.hero .meta{font-size:14px;opacity:.85;margin-bottom:12px}
.hero .chips{display:flex;flex-wrap:wrap;gap:6px}
.hero .chips span{font-size:13px;background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px}
.vtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 0}
.vtiles button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:16px;background:var(--surface);min-height:0}
.vtiles button .ic{font-size:26px}
.vtiles button b{font-size:16px}
.vtiles button span{font-size:12px;color:var(--muted)}
.vtiles button.sel{outline:2px solid #ffb27a;background:#2a1f2a}
body.abend .vtiles button.sel{outline-color:#9d8cff;background:#1f1d3a}
.woche{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.woche div{background:var(--surface);border-radius:12px;padding:7px 0 7px;text-align:center;font-size:11px;color:var(--muted)}
.woche div b{display:block;font-size:16px;color:var(--text);margin:1px 0 3px}
.woche div i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2a2f3b;margin:0 1px}
.woche div i.m{background:#ffb27a}.woche div i.a{background:#9d8cff}
.woche .heute{outline:2px solid rgba(255,255,255,.35)}
.wochetxt{font-size:13px;color:var(--muted);margin:8px 2px 0}
details.card summary{cursor:pointer;color:var(--muted);font-size:15px;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:8px}
#btnStart{background:linear-gradient(90deg,var(--sun1),var(--sun2));color:#1a0b12;font-weight:800;min-height:58px;font-size:19px;box-shadow:0 8px 24px rgba(232,87,126,.3)}
body.abend #btnStart{background:linear-gradient(90deg,#8f7bff,#5b6cff);color:#0b0d1e;box-shadow:0 8px 24px rgba(91,108,255,.3)}
/* Lauf */
.bar{height:8px}
.bar i{background:linear-gradient(90deg,var(--sun1),var(--sun2))}
body.abend .bar i{background:linear-gradient(90deg,#8f7bff,#5b6cff)}
.emoji{width:132px;height:132px;margin:16px auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:70px;
  background:radial-gradient(circle,rgba(255,178,122,.28),rgba(255,178,122,0) 70%)}
body.abend .emoji{background:radial-gradient(circle,rgba(157,140,255,.3),rgba(157,140,255,0) 70%)}
.liste{border:1px solid #262a35}
.liste li .n{width:26px;height:26px;border-radius:50%;background:#2a2340;color:#ffb27a;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
body.abend .liste li .n{background:#24224a;color:#b9adff}
.fig{border:1px solid #262a35}
.name{font-size:29px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
.tile{border-radius:18px;padding:14px}
.tile .v{font-size:27px;font-weight:800;letter-spacing:-.5px}
.tile .v small{font-size:15px;font-weight:600}
.tile .l{font-size:13px;opacity:.75;margin-top:2px}
.tile.a{background:#3a2433}.tile.b{background:#163626}.tile.c{background:#1f2a4a}.tile.d{background:#2c2142}
/* ===== Abend Schritt für Schritt ===== */
.phasen{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 2px}
.phasen div{text-align:center;font-size:11px;color:var(--muted);padding:6px 0 7px;border-radius:12px;background:var(--surface)}
.phasen div span{display:block;font-size:20px;margin-bottom:1px;filter:grayscale(1);opacity:.55}
.phasen div.akt{background:#24224a;color:#d9d2ff;box-shadow:inset 0 0 0 1.5px #8f7bff}
.phasen div.akt span,.phasen div.done span{filter:none;opacity:1}
.phasen div.done{color:#b9adff}
.stepcard{margin:14px 0 0;border-radius:24px;padding:22px 20px;background:linear-gradient(160deg,#211f42,#151729);border:1px solid #2e2b5a;text-align:center}
.stepcard .sicon{width:110px;height:110px;margin:0 auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:58px;
  background:radial-gradient(circle,rgba(157,140,255,.35),rgba(157,140,255,0) 70%)}
.stepcard .snr{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#b9adff}
.stepcard .stitel{font-size:26px;font-weight:800;letter-spacing:-.4px;margin:6px 0 8px}
.stepcard .stext{font-size:17px;color:#cfd3ea;line-height:1.45}
.stepcard .stipp{margin-top:14px;font-size:14px;color:#a7a2d6;background:rgba(255,255,255,.05);border-radius:12px;padding:9px 12px}
.mini{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:12px}
.mini .zeit{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;min-width:96px}
.mini button{min-height:44px;border-radius:999px;padding:10px 18px;background:#2e2b5a;color:#e7e3ff;font-weight:600}
.mini.laeuft .zeit{color:#b9adff}
body.abend #s-run .phase{display:none}
</style>
</head>
<body>

<!-- START -->
<section id="s-start" class="screen on">
  <h1 id="gruss">Guten Morgen, Noah</h1>
  <div class="muted" id="today"></div>
  <div class="woche" id="woche"></div><div class="wochetxt" id="wochetxt"></div>
  <div class="hero" id="hero"></div>

  <div class="card" id="resume" style="display:none">
    <div>Angefangene Routine von <b id="resumeTime"></b> gefunden.</div>
    <div class="seg" style="margin-top:10px">
      <button class="primary" id="btnResume">Fortsetzen</button>
      <button class="ghost" id="btnDiscard">Verwerfen</button>
    </div>
  </div>

  <div class="vtiles">
    <button data-v="kurz" class="vbtn"><span class="ic">☀️</span><b>Kurz</b><span id="durKurz"></span></button>
    <button data-v="lang" class="vbtn"><span class="ic">🌄</span><b>Lang</b><span id="durLang"></span></button>
    <button data-v="abend" class="vbtn"><span class="ic">🌙</span><b>Abend</b><span id="durAbend"></span></button>
  </div>

  <details class="card">
    <summary>⚙︎ Stimme &amp; Töne</summary>
    <label class="row"><span>Stimme</span><input type="checkbox" id="optVoice" checked></label>
    <select id="voiceSel"></select>
    <label class="row"><span>Signaltöne</span><input type="checkbox" id="optBeep" checked></label>
    <button class="ghost small" id="btnTest" style="width:100%">Stimme &amp; Ton testen</button>
  </details>

  <div class="grow"></div>
  <div class="bottom">
    <button class="primary" id="btnStart">Start</button>
  </div>
</section>

<!-- LAUF -->
<section id="s-run" class="screen">
  <div class="top">
    <span class="muted small" id="stepCount"></span>
    <span class="muted small" id="clock"></span>
  </div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="phasen hidden" id="phasen"></div>

  <div style="text-align:center">
    <span class="phase" id="phase"></span>
    <div class="name" id="name"></div>
    <div class="side" id="side"></div>
  </div>

  <!-- Übung -->
  <div id="exView" class="exrow">
    <div class="fig" id="fig"></div>
    <div class="ringwrap">
      <svg viewBox="0 0 240 240">
        <circle cx="120" cy="120" r="108" fill="none" stroke="#222632" stroke-width="14"/>
        <circle id="ring" cx="120" cy="120" r="108" fill="none" stroke="#4cc38a" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="678.6" stroke-dashoffset="0"/>
      </svg>
      <div class="num" id="num">0</div>
    </div>
  </div>

  <!-- Schritt (Abend) -->
  <div id="stepView" class="hidden">
    <div class="stepcard">
      <div class="sicon" id="sIcon"></div>
      <div class="snr" id="sNr"></div>
      <div class="stitel" id="sTitel"></div>
      <div class="stext" id="sText"></div>
      <div class="stipp hidden" id="sTipp"></div>
      <div class="mini hidden" id="mini"><span class="zeit" id="miniZeit">0:30</span><button id="miniBtn">▶ Timer</button></div>
    </div>
  </div>

  <!-- Checkliste -->
  <div id="checkView" class="hidden">
    <div class="emoji" id="emoji"></div>
    <ul class="liste hidden" id="liste"></ul>
    <div class="fig hidden" id="repFig" style="max-width:260px;margin:10px auto 0"></div>
    <div class="reps hidden" id="repsBox">
      <button id="repMinus">−</button><b id="repNum">10</b><button id="repPlus">+</button>
    </div>
    <div class="card" id="kgBox">
      <div class="muted small">Gewicht in kg</div>
      <input id="kg" class="kg" inputmode="decimal" placeholder="z. B. 94,6" autocomplete="off">
    </div>
  </div>

  <div class="cue" id="cue" style="text-align:center"></div>
  <div class="next" id="next" style="text-align:center"></div>

  <div class="grow"></div>
  <div class="bottom">
    <div class="ctrl" id="exCtrl">
      <button id="btnBack">◀︎ Zurück</button>
      <button id="btnPause">Pause</button>
      <button id="btnSkip">Weiter ▶︎</button>
    </div>
    <div class="seg hidden" id="checkCtrl">
      <button class="ghost" id="btnNo">Auslassen</button>
      <button class="ok" id="btnDone">Erledigt ✓</button>
    </div>
    <button class="ghost small" id="btnAbort">Routine beenden</button>
  </div>
</section>

<!-- ENDE -->
<section id="s-end" class="screen">
  <h1 id="endTitel">Fertig 💪</h1>
  <div class="muted" id="endSub"></div>
  <div class="tiles" id="tiles"></div>
  <div class="card sum" id="sum"></div>
  <div class="grow"></div>
  <div class="bottom">
    <button class="primary" id="btnSend">An Jarvis senden</button>
    <button id="btnCopy">Text kopieren</button>
    <pre id="logText"></pre>
    <button class="ghost" id="btnHome">Zur Startseite</button>
  </div>
</section>

<script>
"use strict";
/* ---------- Übungen ---------- */
// t = Haltezeit in Sek., s = beidseitig (je Seite), v = aus dem Video (Schulter-&-Posture-Challenge)
const EX = {
  armeSchwingen:{n:"Arme schwingen",t:30,c:"Aufrecht im Schneidersitz. Arme locker nach vorne und über den Kopf schwingen."},
  kopfkreisen:{n:"Kopfkreisen",t:30,c:"Langsame Halbkreise vorne, Schultern bleiben tief."},
  rollenRueck:{n:"Schulterrollen rückwärts",t:20,c:"Schultern groß nach oben, hinten und unten kreisen."},
  rollenVor:{n:"Schulterrollen vorwärts",t:20,c:"Schultern groß nach oben, vorne und unten kreisen."},
  hochziehen:{n:"Schultern hochziehen",t:20,c:"Schultern zu den Ohren ziehen, kurz halten, bewusst fallen lassen."},
  armRotation:{n:"Schulter-Arm-Rotation",t:30,c:"Arme seitlich gestreckt, kleine Kreise, langsam größer werden."},
  armRollenVor:{n:"Schulter-Arm-Rollen vorwärts",t:20,c:"Fingerspitzen auf die Schultern, mit den Ellbogen große Kreise vorwärts."},
  armRollenRueck:{n:"Schulter-Arm-Rollen rückwärts",t:20,c:"Fingerspitzen auf die Schultern, mit den Ellbogen große Kreise rückwärts."},
  overhead:{n:"Overhead Stretch",t:30,c:"Hände über dem Kopf verschränken, Handflächen nach oben, ganz lang machen."},
  interlocked:{n:"Seitstretch verschränkt",t:20,s:1,c:"Hände über dem Kopf verschränkt, Oberkörper zur Seite neigen."},
  chestOpener:{n:"Seated Chest Opener",t:30,c:"Hände hinter dem Rücken verschränken, Brust heben, Schulterblätter zusammen."},
  extension:{n:"Schulter-Extension-Stretch",t:30,c:"Hände hinten verschränkt, gestreckte Arme vom Rücken weg nach hinten heben."},
  armRotHoch:{n:"Angehobene Armrotation",t:30,c:"Oberarme auf Schulterhöhe, Ellbogen 90 Grad, Unterarme nach oben und unten drehen."},
  schmetterling:{n:"Schmetterling-Stretch",t:30,c:"Hände an den Hinterkopf, Ellbogen weit öffnen und wieder schließen."},
  elefant:{n:"Elefantenrüssel",t:30,c:"Wie im Video: Arm gestreckt nach oben, in weichen Bögen über den Kopf führen."},
  ueberkopf:{n:"Überkopf-Schulter-Stretch",t:30,s:1,c:"Ellbogen hinter den Kopf, mit der anderen Hand sanft ziehen."},
  einarmig:{n:"Schulterstretch einarmig",t:30,s:1,c:"Arm gestreckt vor der Brust zur Gegenseite ziehen."},
  band:{n:"Stretchband",t:40,c:"Band weit greifen, gestreckte Arme langsam über den Kopf nach hinten und zurück."},
  twist:{n:"Twist",t:30,s:1,c:"Aufrecht sitzen, Oberkörper drehen, hintere Hand abstützen, Blick über die Schulter."},
  nacken:{n:"Nacken-Stretch",t:30,s:1,c:"Hand über den Kopf, Ohr sanft zur Schulter ziehen, andere Schulter tief."},
  chinTuck:{n:"Chin Tuck",t:30,c:"Kinn gerade nach hinten schieben, drei Sekunden halten, lösen, wiederholen."},
  // Rückenblock
  katzeKuh:{n:"Katze-Kuh",t:45,c:"Vierfüßlerstand. Mit dem Atem Rücken rund machen und sanft hohl werden lassen."},
  katzeKuhL:{n:"Katze-Kuh",t:45,c:"Vierfüßlerstand. Mit dem Atem Rücken rund machen und sanft hohl werden lassen."},
  birdDog:{n:"Bird-Dog",t:45,c:"Vierfüßler. Gegengleich Arm und Bein strecken, Rücken bleibt gerade, abwechseln."},
  birdDogL:{n:"Bird-Dog",t:45,c:"Vierfüßler. Gegengleich Arm und Bein strecken, Rücken bleibt gerade, abwechseln."},
  openBook:{n:"Open Book",t:30,s:1,c:"Seitlage, Knie angewinkelt. Oberen Arm wie ein Buch nach hinten öffnen, Blick folgt."},
  neunzig:{n:"90/90-Hüftwechsel",t:45,c:"Sitzend, beide Knie 90 Grad. Knie langsam von einer Seite zur anderen kippen."},
  hueftbeuger:{n:"Hüftbeuger-Dehnung",t:30,s:1,c:"Halbkniestand. Gesäß anspannen, Becken leicht nach vorne schieben."},
  hueftbeugerL:{n:"Hüftbeuger-Dehnung",t:40,s:1,c:"Halbkniestand. Gesäß anspannen, Becken leicht nach vorne schieben."},

/* ---------- Schritte bauen ---------- */
function flowSteps(v){
  const st=[];
  FLOW[v].forEach(id=>{const e=EX[id];
    if(e.s){st.push({k:"ex",id,side:"Linke Seite",prep:PREP,t:e.t});st.push({k:"ex",id,side:"Rechte Seite",prep:SWITCH,t:e.t,sw:1})}
    else st.push({k:"ex",id,side:"",prep:PREP,t:e.t})});
  return st;
}
function build(v){
  if(v==="abend") return [...["kleidung","schuhe","accessoires","reinigen","creme","magnesium"].map(id=>({k:"schritt",id})),...flowSteps("abend").map(x=>({...x,ph:"dehnen"})),{k:"schritt",id:"sleep"},{k:"timer",id:"lesen",ph:"schlafen"}];
  const st=[];
  st.push({k:"check",id:"gewicht"},{k:"check",id:"wasser"});
  FLOW[v].forEach(id=>{
    const e=EX[id];
    if(e.s){
      st.push({k:"ex",id,side:"Linke Seite",prep:PREP,t:e.t});
      st.push({k:"ex",id,side:"Rechte Seite",prep:SWITCH,t:e.t,sw:1});
    } else st.push({k:"ex",id,side:"",prep:PREP,t:e.t});
  });
  ["liegestuetze","klimmzuege","situps","dusche","haut","supps","outfit"].forEach(id=>st.push({k:"check",id}));
  return st;
}
function dauerMin(v){
  const s=build(v).reduce((a,x)=>a+(x.k==="ex"?x.prep+x.t:x.k==="timer"?TIMER[x.id].t:x.k==="schritt"?SCHRITT[x.id].d:CHECK[x.id].d),0);
  return Math.round(s/60);
}

/* ---------- Ton & Stimme ---------- */
let actx=null, voices=[];
function audioInit(){
  try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){}
}
function beep(f=880,dur=.12,vol=.25){
  if(!$("optBeep").checked||!actx) return;
  try{
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
    o.frequency.value=f; o.type="sine"; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
function gong(){ beep(523,.6,.3); setTimeout(()=>beep(784,.7,.25),120); }
function loadVoices(){
  if(!("speechSynthesis" in window)) return;
  voices=speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang));
  const rank=v=>(/premium/i.test(v.name)?0:/enhanced|erweitert/i.test(v.name)?1:2);
  voices.sort((a,b)=>rank(a)-rank(b)||a.name.localeCompare(b.name));
  const saved=store.get("voice"), sel=$("voiceSel");
  sel.innerHTML=voices.length?voices.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join(""):"<option>Standardstimme</option>";
  const i=voices.findIndex(v=>v.name===saved); if(i>=0) sel.value=i;
}
function say(txt){
  if(!$("optVoice").checked||!("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt); u.lang="de-DE"; u.rate=1;
    const v=voices[+$("voiceSel").value]; if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

    let sx=sc.x, stp=sc.tipp?"💡 "+sc.tipp:"", link=false;
    if(st.id==="kleidung"){const o=outfitFuer(tagMorgen()); link=true;
      sx=o?`Jarvis schlägt für morgen vor (Stufe ${o.stufe}${o.angenommen==="1"?", Anlass angenommen":""}):\n`+outfitZeilen(o).map(x=>x[0]+": "+x[1]).join("\n")+(o.begruendung?"\n\n"+o.begruendung:"")+(o.wetter?"\n🌦 "+o.wetter:"")

  if(st.k==="check"){
    let c=CHECK[st.id];
    if(st.id==="outfit"){const o=outfitFuer(isoLocal(new Date()).slice(0,10)); if(o) c={...c,c:"Heute laut Jarvis – ✓ = so getragen:",l:outfitZeilen(o).filter(x=>!x[0].includes("Ersatz")).map(x=>[x[1],x[0]])};}
    phase="check"; setPhase("check",c.r?"Kraft":"Checkliste");
    $("name").textContent=c.n; $("side").textContent=""; $("cue").textContent=c.c;
    $("exView").classList.add("hidden"); $("checkView").classList.remove("hidden");
    $("kgBox").classList.toggle("hidden",!c.kg); if(c.kg) $("kg").value=S.kg||"";
    $("emoji").textContent=c.e||""; $("emoji").classList.toggle("hidden",!c.e||!!c.l);
    $("liste").classList.toggle("hidden",!c.l);
    if(c.l)$("cue").textContent="";
    $("liste").innerHTML=(c.l?`<li class="kopf">${c.c}</li>`:"")+(c.l||[]).map((x,i)=>`<li class="${x[2]?"kauf":""}"><span class="n">${i+1}</span><span>${x[0]}${x[1]?`<small>${x[1]}</small>`:""}</span></li>`).join("");
    $("repFig").classList.toggle("hidden",!c.r); $("repsBox").classList.toggle("hidden",!c.r);
    if(c.r){ $("repFig").innerHTML=svgFig(st.id); repN=(S.reps&&S.reps[st.id])||c.r; $("repNum").textContent=repN; $("side").textContent=c.r+" Wiederholungen"; }
    $("exCtrl").classList.add("hidden"); $("checkCtrl").classList.remove("hidden");
    say(c.n+". "+(c.l?c.l.filter(x=>!x[2]).map(x=>x[0]).join(", "):c.c));
  } else {
    const e=EX[st.id];
    $("exView").classList.remove("hidden"); $("checkView").classList.add("hidden");
    $("exCtrl").classList.remove("hidden"); $("checkCtrl").classList.add("hidden");
    $("name").textContent=e.n; $("side").textContent=st.side; $("cue").textContent=e.c;
    $("fig").innerHTML=svgFig(st.id);
    $("btnPause").textContent="Pause";
    startPhase("prep",st.prep);
    say(st.sw?"Wechsel. "+st.side+".":e.n+(st.side?", "+st.side:"")+". "+e.c);
  }
}
function setPhase(cls,txt){ const p=$("phase"); p.className="phase "+cls; p.textContent=txt; }
function startPhase(p,sec){
  phase=p; phaseLen=sec*1000; phaseEnd=performance.now()+phaseLen; lastSec=-1;
  setPhase(p, p==="prep"?"Einnehmen":"Halten");
  $("ring").style.stroke=p==="prep"?"var(--prep)":"var(--hold)";
}
let miniEnd=0,miniSek=30;
function miniStop(){miniEnd=0;$("mini").classList.remove("laeuft")}
function miniTick(){if(!miniEnd)return;const r_=Math.ceil((miniEnd-Date.now())/1000);
  if(r_<=0){miniStop();$("miniZeit").textContent="✓";beep(660,.2);setTimeout(()=>beep(990,.3),200);say("Fertig. Abspülen.");$("miniBtn").textContent="↺ Nochmal";return}
  $("miniZeit").textContent=`0:${pad(r_)}`}
function tick(){
  $("clock").textContent=hm(new Date()); miniTick();
  if(phase!=="prep"&&phase!=="hold") return;
  const rem=paused?pausedRem:Math.max(0,phaseEnd-performance.now());
  const sec=Math.ceil(rem/1000);
  $("num").textContent=steps[S.idx]&&steps[S.idx].k==="timer"?`${Math.floor(sec/60)}:${pad(sec%60)}`:sec;
  $("num").style.fontSize=steps[S.idx]&&steps[S.idx].k==="timer"?"40px":"";
  $("ring").style.strokeDashoffset=(678.6*(1-rem/phaseLen)).toFixed(1);
  if(paused) return;
  if(sec!==lastSec){ if(sec>0&&sec<=3&&steps[S.idx].k!=="timer") beep(sec===1?990:880); lastSec=sec; }
  if(rem<=0){
    const st=steps[S.idx];
    if(phase==="prep"){ beep(1320,.18); startPhase("hold",st.t); }
    else if(st.k==="timer"){ S.ex[S.idx]=1; S.res[st.id]=1; save(); beep(392,1.2,.18); setTimeout(()=>beep(523,1.4,.15),500); enter(S.idx+1); }
    else { S.ex[S.idx]=1; save(); gong(); enter(S.idx+1); }
  }
}
function togglePause(){
  if(phase!=="prep"&&phase!=="hold") return;
  if(!paused){ paused=true; pausedRem=Math.max(0,phaseEnd-performance.now()); setPhase("pause","Pause"); $("btnPause").textContent="Weiter"; try{speechSynthesis.cancel()}catch(e){} }
  else { paused=false; phaseEnd=performance.now()+pausedRem; setPhase(phase,phase==="prep"?"Einnehmen":steps[S.idx].k==="timer"?TIMER[steps[S.idx].id].n:"Halten"); $("btnPause").textContent="Pause"; }
}
function checkDone(ok){
  const st=steps[S.idx];
  if(st.id==="gewicht"){
    const v=$("kg").value.trim().replace(",",".");
    const n=parseFloat(v);
    if(ok&&!(n>30&&n<250)){ $("kg").focus(); $("cue").textContent="Bitte ein gültiges Gewicht eingeben – oder „Auslassen“."; return; }
    S.kg=ok?n.toFixed(1):"";
  }
  if(st.k==="check"&&CHECK[st.id].r){ S.reps=S.reps||{}; S.reps[st.id]=ok?repN:0; }
  S.res[st.id]=ok?1:0; save(); enter(S.idx+1);
}
function finish(){
  if(S.v==="abend") return finishAbend();
  clearInterval(timer); phase=""; wakeOff();
  const end=new Date(), start=new Date(S.start);
  const exSteps=steps.map((s,i)=>s.k==="ex"?i:-1).filter(i=>i>=0);
  const exDone=exSteps.filter(i=>S.ex[i]).length;
  const min=Math.max(1,Math.round((end-start)/60000));
  const r=k=>S.res[k]?1:0;
  const rp=k=>(S.reps&&S.reps[k])||0;
  const log=[
    "Morgenroutine",
    `datum=${S.start.slice(0,10)}`,
    `start=${S.start}`,
    `ende=${isoLocal(end)}`,
    `variante=${S.v}`,
    `dauer_min=${min}`,
    `gewicht=${S.kg||""}`,
    `wasser=${r("wasser")}`,
    `flow=${exDone}/${exSteps.length}`,
    `liegestuetze=${rp("liegestuetze")}`,
    `klimmzuege=${rp("klimmzuege")}`,
    `situps=${rp("situps")}`,
    `dusche=${r("dusche")}`,
    `haut=${r("haut")}`,
    `supplements=${r("supps")}`,
    `outfit=${r("outfit")}`,
    `outfit_ids=${r("outfit")&&outfitFuer(isoLocal(new Date()).slice(0,10))?outfitFuer(isoLocal(new Date()).slice(0,10)).ids||"":""}`
  ].join("; ")+";";
  S.log=log; S.fertig=isoLocal(end); save();
  const z=(l,v)=>`<div><span class="muted">${l}</span><b>${v}</b></div>`;
  $("endSub").textContent=`${hm(start)}–${hm(end)} · ${min} Min. · ${S.v==="kurz"?"Kurz":"Lang"}`;
  $("sum").innerHTML=z("Gewicht",S.kg?S.kg.replace(".",",")+" kg":"–")+z("Wasser",r("wasser")?"✓":"–")+
    z("Rücken-Flow",`${exDone}/${exSteps.length} Übungen`)+
    z("Liegestütze / Klimmzüge / Sit-ups",`${rp("liegestuetze")} / ${rp("klimmzuege")} / ${rp("situps")}`)+
    z("Duschen",r("dusche")?"✓":"–")+z("Hautpflege",r("haut")?"✓":"–")+
    z("Supplements",r("supps")?"✓":"–")+z("Outfit",r("outfit")?"✓":"–");
  $("logText").textContent=log; verlaufMerken(); kacheln();
  show("s-end"); say("Fertig. Starker Start in den Tag.");
}

function finishAbend(){
  clearInterval(timer); phase=""; wakeOff(); miniStop(); document.body.classList.remove("nacht");
  const end=new Date(), start=new Date(S.start);
  const flow=steps.map((s,i)=>s.k==="ex"?i:-1).filter(i=>i>=0), fd=flow.filter(i=>S.ex[i]).length;
  const min=Math.max(1,Math.round((end-start)/60000)), r=k=>S.res[k]?1:0;
  const datum=isoLocal(new Date(start.getTime()-4*3600e3)).slice(0,10);
  const lesen=S.res.lesen?15:0, outfit=r("kleidung")&&r("schuhe")?1:0, haut=r("reinigen")&&r("creme")?1:0;
  const log=["Abendroutine",`datum=${datum}`,`start=${S.start}`,`ende=${isoLocal(end)}`,`dauer_min=${min}`,
    `outfit=${outfit}`,`haut_abends=${haut}`,`supplements=${r("magnesium")}`,`dehnen=${fd}/${flow.length}`,
    `sleepcycle=${r("sleep")}`,`lesen_min=${lesen}`].join("; ")+";";
  S.log=log; S.fertig=isoLocal(end); save();
  const z=(l,v)=>`<div><span class="muted">${l}</span><b>${v}</b></div>`;
  $("endSub").textContent=`${hm(start)}–${hm(end)} · ${min} Min. · Abend`;
  $("sum").innerHTML=z("👔 Outfit am Herrendiener",outfit?"✓":"–")+z("🧴 Hautpflege abends",haut?"✓":"–")+z("💊 Magnesium",r("magnesium")?"✓":"–")+
    z("🧘 Rücken-Dehnen",`${fd}/${flow.length}`)+z("🌙 Sleep Cycle",r("sleep")?"✓":"–")+z("📖 Lesen",lesen?"15 Min. ✓":"–");
  $("logText").textContent=log; verlaufMerken(); kacheln();
  show("s-end"); say("Fertig. Gute Nacht, Noah.");
}

/* ---------- Darstellung ---------- */
const BAUSTEIN={gewicht:"⚖️ Wiegen",wasser:"💧 Wasser",liegestuetze:"💪 Kraft",dusche:"🚿 Duschen",haut:"🧴 Haut",supps:"💊 Supplements",outfit:"👔 Outfit",
  kleidung:"👔 Outfit für morgen",reinigen:"🧴 Hautpflege",magnesium:"💊 Magnesium",sleep:"🌙 Sleep Cycle",lesen:"📖 Lesen 15′"};
function heroRender(){
  const st=build(variante),n=st.filter(x=>x.k==="ex").length,ab=variante==="abend";
  const chips=[];st.forEach(x=>{if(x.k==="ex"){if(!chips.includes("flow"))chips.push("flow")}else if(BAUSTEIN[x.id]&&!chips.includes(x.id))chips.push(x.id)});
  $("hero").className="hero"+(ab?" abend":"");
  $("hero").innerHTML=`<div class="big">${ab?"🌙":variante==="lang"?"🌄":"☀️"}</div><div class="lbl">${ab?"Abendroutine":"Morgenroutine"} · ${variante==="kurz"?"Kurz":variante==="lang"?"Lang":"Abend"}</div>
    <div class="ttl">ca. ${dauerMin(variante)} Minuten</div><div class="meta">${n} Übungen im Rücken-Flow${ab?" · Lesen zum Schluss":""}</div>
    <div class="chips">${chips.map(c=>`<span>${c==="flow"?"🧘 Rücken-Flow":BAUSTEIN[c]}</span>`).join("")}</div>`;
  document.body.classList.toggle("abend",ab);document.body.classList.toggle("morgen",!ab);
  $("btnStart").textContent=ab?"Abendroutine starten":"Morgenroutine starten";
}
function wocheRender(){
  const h=store.get("verlauf",[])||[],d=new Date(),mo=new Date(d);mo.setDate(d.getDate()-((d.getDay()+6)%7));
  let m=0,a=0;
  $("woche").innerHTML=["Mo","Di","Mi","Do","Fr","Sa","So"].map((t,k)=>{const x=new Date(mo);x.setDate(mo.getDate()+k);
    const iso=`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`,hm_=h.some(y=>y.d===iso&&y.v!=="abend"),ha=h.some(y=>y.d===iso&&y.v==="abend");
    if(hm_)m++;if(ha)a++;
    return `<div class="${x.toDateString()===d.toDateString()?"heute":""}">${t}<b>${x.getDate()}</b><i class="${hm_?"m":""}"></i><i class="${ha?"a":""}"></i></div>`}).join("");
  $("wochetxt").textContent=`Diese Woche: ${m}× Morgen ☀️ · ${a}× Abend 🌙`;
}
function verlaufMerken(){
  const datum=isoLocal(new Date(new Date(S.start).getTime()-4*3600e3)).slice(0,10);
  const h=(store.get("verlauf",[])||[]).filter(x=>!(x.d===datum&&x.v===S.v));h.push({d:datum,v:S.v});store.set("verlauf",h.slice(-120));
}
function kacheln(){
  const min=Math.max(1,Math.round((new Date()-new Date(S.start))/60000));
  const chk=steps.filter(x=>x.k==="check"||x.k==="schritt"),ok=chk.filter(x=>S.res[x.id]).length;
  const fl=steps.map((s,i)=>s.k==="ex"?i:-1).filter(i=>i>=0),fd=fl.filter(i=>S.ex[i]).length;
  const T=(v,l,c)=>`<div class="tile ${c}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  const vierte=S.v==="abend"?T(S.res.lesen?"15<small> Min.</small>":"–","Gelesen 📖","d"):T(S.kg?S.kg.replace(".",",")+"<small> kg</small>":"–","Gewicht ⚖️","d");
  $("endTitel").textContent=S.v==="abend"?"Gute Nacht 🌙":"Stark gestartet ☀️";
  $("tiles").innerHTML=T(min+"<small> Min.</small>","Dauer","a")+T(`${ok}/${chk.length}`,"Punkte erledigt","b")+T(`${fd}/${fl.length}`,"Rücken-Flow","c")+vierte;
}

/* ---------- Start-Bildschirm ---------- */
let variante=(()=>{const d=new Date(),h=d.getHours();return h>=17||h<4?"abend":[0,6].includes(d.getDay())?"lang":"kurz"})();
function markV(){ document.querySelectorAll(".vbtn").forEach(b=>b.classList.toggle("sel",b.dataset.v===variante)); $("gruss").textContent=variante==="abend"?"Guten Abend, Noah":"Guten Morgen, Noah"; heroRender(); }
// ---- Outfit von Jarvis (Tab „Morgen“ im Sheet Garderobe, als CSV veröffentlicht) ----
const OUTFIT_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSucGG1xTKhNTGkzn-4tbXNgIx_nURPV4R_5WcdPaejnSOR_c7qOEOzeUorDMQc4qaDBB2YdLM6cD2S/pub?gid=753380724&single=true&output=csv";
const JARVIS_LINK="tg://resolve?domain=noah_faber_jarvis_bot";
let OUTFIT=null; try{OUTFIT=JSON.parse(localStorage.getItem("outfit")||"null")}catch(e){}
const esc=t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function csvZeilen(t){const z=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===","){r.push(f);f=""}else if(c==="\n"){r.push(f);z.push(r);r=[];f=""}else if(c!=="\r")f+=c}
  if(f||r.length){r.push(f);z.push(r)}return z}
async function outfitLaden(){ if(!OUTFIT_URL.startsWith("http"))return;
  try{const t=await (await fetch(OUTFIT_URL+(OUTFIT_URL.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"})).text();
    const o={};csvZeilen(t).forEach(r=>{if(r[0])o[r[0].trim()]=(r[1]||"").trim()});
    if(o.datum){OUTFIT=o;try{localStorage.setItem("outfit",JSON.stringify(o))}catch(e){}}}catch(e){}}
function outfitFuer(tag){return OUTFIT&&OUTFIT.datum===tag?OUTFIT:null}
function tagMorgen(){const d=new Date(Date.now()-4*3600e3);d.setDate(d.getDate()+1);return isoLocal(d).slice(0,10)}
function outfitZeilen(o){return [["👔 Oberteil",o.oberteil],["👖 Hose",o.hose],["👞 Schuhe + Gürtel",o.schuhe],["🧥 Jacke",o.jacke],["⌚ Accessoires",o.accessoires],["☔ Ersatz",o.ersatz]].filter(x=>x[1])}
outfitLaden();

function initStart(){
  const d=new Date();
  $("today").textContent=d.toLocaleDateString("de-AT",{weekday:"long",day:"numeric",month:"long"});
  $("durKurz").textContent=`ca. ${dauerMin("kurz")} Min.`;
  $("durLang").textContent=`ca. ${dauerMin("lang")} Min.`;
  $("durAbend").textContent=`ca. ${dauerMin("abend")} Min.`;
  wocheRender();
  markV();
  const o=store.get("optionen"); if(o){ $("optVoice").checked=o.voice!==false; $("optBeep").checked=o.beep!==false; }
  const alt=store.get("sitzung");
  if(alt&&!alt.fertig&&(Date.now()-new Date(alt.start))<3*3600e3){
    $("resume").style.display=""; $("resumeTime").textContent=hm(new Date(alt.start))+" Uhr";
  } else $("resume").style.display="none";
}
document.querySelectorAll(".vbtn").forEach(b=>b.onclick=()=>{variante=b.dataset.v;markV();});
function saveOpts(){ store.set("optionen",{voice:$("optVoice").checked,beep:$("optBeep").checked}); const v=voices[+$("voiceSel").value]; if(v) store.set("voice",v.name); }
["optVoice","optBeep","voiceSel"].forEach(id=>$(id).onchange=saveOpts);
$("btnTest").onclick=()=>{ audioInit(); beep(880); setTimeout(()=>beep(990),400); setTimeout(()=>say("Guten Morgen, Noah. So klingt die Ansage."),800); };
$("btnStart").onclick=()=>{ audioInit(); saveOpts(); say(variante==="abend"?"Abendroutine. Los geht's.":"Los geht's."); startNew(variante); };
$("btnResume").onclick=()=>{ audioInit(); S=store.get("sitzung"); run(); };
$("btnDiscard").onclick=()=>{ store.del("sitzung"); initStart(); };

/* ---------- Lauf-Steuerung ---------- */
$("btnPause").onclick=togglePause;
$("miniBtn").onclick=()=>{audioInit();miniEnd=Date.now()+miniSek*1000;$("mini").classList.add("laeuft");$("miniBtn").textContent="läuft …";miniTick()};
$("btnSkip").onclick=()=>{ try{speechSynthesis.cancel()}catch(e){} enter(S.idx+1); };
$("btnBack").onclick=()=>{ try{speechSynthesis.cancel()}catch(e){} enter(Math.max(0,S.idx-1)); };
let repN=10;
$("repMinus").onclick=()=>{ repN=Math.max(0,repN-1); $("repNum").textContent=repN; };
$("repPlus").onclick=()=>{ repN=Math.min(99,repN+1); $("repNum").textContent=repN; };
$("btnDone").onclick=()=>checkDone(true);
$("btnNo").onclick=()=>checkDone(false);
$("btnAbort").onclick=()=>{ if(confirm("Routine jetzt beenden? Erledigtes wird gespeichert.")) finish(); };
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ if((phase==="prep"||phase==="hold")&&!paused) togglePause(); }
  else if(phase) wakeOn();
});

/* ---------- Ende ---------- */
$("btnSend").onclick=()=>{
  const url="shortcuts://run-shortcut?name="+encodeURIComponent("Morgen an Jarvis")+"&input=text&text="+encodeURIComponent(S.log);
  location.href=url;
};
$("btnCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(S.log); $("btnCopy").textContent="Kopiert ✓"; }catch(e){ $("btnCopy").textContent="Kopieren nicht möglich"; } };
$("btnHome").onclick=()=>{ initStart(); show("s-start"); };

/* ---------- Init ---------- */
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
initStart();
</script>
